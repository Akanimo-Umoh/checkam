 part that scrolls on a phone. In Figma: keep frames 390 × 844 and set vertical scrolling.<\u002Fp>\n  <\u002Fdiv>\n  <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n    <section style=\"display: flex; flex-direction: column; gap: 20px\">\n      <h2 style=\"margin: 0; font-size: 20px; font-weight: 700\">{{ row.title }}<\u002Fh2>\n      <div style=\"display: flex; gap: 40px; align-items: flex-start\">\n        <sc-for list=\"{{ row.screens }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; width: 390px; flex: none\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px\">\n              <span style=\"font-size: 14px; font-weight: 700; color: #5E6863\">{{ s.num }}<\u002Fspan>\n              <span style=\"font-size: 16px; font-weight: 700\">{{ s.label }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"width: 390px; border-radius: 44px; overflow: hidden; box-shadow: 0 1px 0 rgba(16,24,20,0.08), 0 18px 40px rgba(16,24,20,0.14)\">\n              <dc-import name=\"Main\" full-length=\"true\" start-screen=\"{{ s.screen }}\" start-scenario=\"{{ s.scen }}\" start-signed-in=\"{{ s.signed }}\" start-lang=\"{{ s.lang }}\" start-tab=\"{{ s.tab }}\" start-used=\"{{ s.used }}\" hint-size=\"390px,844px\"><\u002Fdc-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:3760,&quot;height&quot;:7000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    function sc(num, label, screen, scen, signed, lang, tab) {\n      return { num: num, label: label, screen: screen, scen: scen || 'matched', signed: signed ? 'true' : 'false', lang: lang || 'en', tab: tab || 'checks', used: '0' };\n    }\n    function f6(num, label, screen, scen, used, lang) {\n      return { num: num, label: label, screen: screen, scen: scen || 'matched', signed: 'false', lang: lang || 'en', tab: 'checks', used: String(used) };\n    }\n    return {\n      rows: [\n        { title: \"1 · Welcome and sign-in\", screens: [\n          sc('1.1', 'Welcome: snap a medicine', 'onb1'),\n          sc('1.2', 'Welcome: the number check', 'onb2'),\n          sc('1.3', 'Welcome: alerts and reports', 'onb3'),\n          sc('1.4', 'Sign in: Google or email', 'signin'),\n          sc('1.5', 'Email code', 'code')\n        ] },\n        { title: \"2 · Find a medicine\", screens: [\n          sc('2.1', 'Home, as a guest', 'home', null, false, null, null),\n          sc('2.2', 'Home, signed in', 'home', null, true, null, null),\n          sc('2.3', 'Snap the pack', 'scan', null, false, null, null),\n          sc('2.4', 'Photo too blurry', 'blurry', null, false, null, null),\n          sc('2.5', 'Confirm what we read', 'confirm', null, false, null, null),\n          sc('2.6', 'Type the NAFDAC number', 'typeNo', null, false, null, null),\n          sc('2.7', 'Search by name', 'search', null, false, null, null),\n          sc('2.8', 'Checking', 'checking', null, false, null, null)\n        ] },\n        { title: \"3 · Results, as a guest\", screens: [\n          sc('3.1', 'Matched', 'result', 'matched', false, null, null),\n          sc('3.2', 'Matched, renewal in progress', 'result', 'renewal', false, null, null),\n          sc('3.3', 'Unmatched: borrowed number', 'result', 'unmatched', false, null, null),\n          sc('3.4', 'Unverified', 'result', 'unverified', false, null, null),\n          sc('3.5', 'Alert found: batch needed', 'alertBatch', 'alert', false, null, null),\n          sc('3.6', 'Official alert', 'result', 'alert', false, null, null)\n        ] },\n        { title: \"4 · Signed in: full report, reports, history, alerts\", screens: [\n          sc('4.1', 'Matched, signed in', 'result', 'matched', true, null, null),\n          sc('4.2', 'Full report', 'details', 'matched', true, null, null),\n          sc('4.3', 'Report this product', 'report', 'unmatched', true, null, null),\n          sc('4.4', 'Report received', 'reportDone', 'unmatched', true, null, null),\n          sc('4.5', 'History: my checks', 'history', null, true, null, null),\n          sc('4.6', 'History: my reports', 'history', null, true, null, 'reports'),\n          sc('4.7', 'Alerts and alert settings', 'alerts', null, true, null, null),\n          sc('4.8', 'History, as a guest', 'history', null, false, null, null)\n        ] },\n        { title: \"5 · Pidgin\", screens: [\n          sc('5.1', 'Welcome in Pidgin', 'onb1', null, false, 'pg', null),\n          sc('5.2', 'Matched in Pidgin', 'result', 'matched', false, 'pg', null),\n          sc('5.3', 'Unmatched in Pidgin', 'result', 'unmatched', false, 'pg', null),\n          sc('5.4', 'Official alert in Pidgin', 'result', 'alert', false, 'pg', null)\n        ] },\n        { title: \"6 · Free checks\", screens: [\n          f6('6.1', 'Home: 3 free checks left', 'home', null, 2, null),\n          f6('6.2', 'Matched: why sign up', 'result', 'matched', 3, null),\n          f6('6.3', 'Unmatched: why sign up', 'result', 'unmatched', 3, null),\n          f6('6.4', 'Free checks used up', 'limit', null, 5, null),\n          f6('6.5', 'Free checks used up (Pidgin)', 'limit', null, 5, 'pg')\n        ] }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
